services:
  nuanyan:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_PATH: /data/nuanyan.sqlite3
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - nuanyan-data:/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  nuanyan-data:
